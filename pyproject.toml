[project]
name = "lsp-playerkit"
version = "1.0.0"
description = "LSP 服务器玩家工具箱：珍珠炮 / 边境炮配置器"
requires-python = ">=3.9"
dependencies = ["pywebview>=6,<7", "numpy>=1.24,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
